services:
  - type: web
    name: restaurant-reconciliation
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm install && npm install --prefix apps/demo && npm run build && npm run build --prefix apps/demo
    startCommand: node dist/server.js
    healthCheckPath: /health
    envVars:
      - key: STORE_PATH
        value: data/store.json
